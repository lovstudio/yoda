name: Release Post-CI (China Mirror)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Published release tag to mirror (e.g. v0.17.3)'
        required: true

permissions:
  contents: read

concurrency:
  group: release-cn-mirror-${{ inputs.tag }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag }}

jobs:
  sync-cn-mirror:
    name: sync-cn-mirror (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        platform: [linux, windows, macos]
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - uses: ./.github/actions/setup-build
        with:
          cn-mirror-base-url: ${{ vars.YODA_CN_MIRROR_PUBLIC_BASE_URL }}

      - name: Check China mirror secrets
        id: cn-mirror
        shell: bash
        env:
          CN_ENDPOINT: ${{ vars.YODA_CN_MIRROR_ENDPOINT }}
          CN_PUBLIC_BASE_URL: ${{ vars.YODA_CN_MIRROR_PUBLIC_BASE_URL }}
          CN_ACCESS_KEY_ID: ${{ secrets.YODA_CN_MIRROR_ACCESS_KEY_ID }}
          CN_SECRET_ACCESS_KEY: ${{ secrets.YODA_CN_MIRROR_SECRET_ACCESS_KEY }}
        run: |
          if [ -n "$CN_ENDPOINT" ] && [ -n "$CN_PUBLIC_BASE_URL" ] && [ -n "$CN_ACCESS_KEY_ID" ] && [ -n "$CN_SECRET_ACCESS_KEY" ]; then
            echo "has_cn_mirror=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_cn_mirror=false" >> "$GITHUB_OUTPUT"
            echo "::warning::China mirror secrets or variables not configured. Skipping China mirror upload."
          fi

      - name: Download published GitHub Release assets
        if: ${{ steps.cn-mirror.outputs.has_cn_mirror == 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p release
          case "${{ matrix.platform }}" in
            linux)
              patterns=(
                --pattern 'yoda-*.AppImage'
                --pattern 'yoda-*.AppImage.blockmap'
                --pattern 'yoda-*.deb'
                --pattern 'yoda-*.rpm'
                --pattern 'v1-stable-linux*.yml'
              )
              ;;
            windows)
              patterns=(
                --pattern 'yoda-*.exe'
                --pattern 'yoda-*.exe.blockmap'
                --pattern 'yoda-*.msi'
                --pattern 'v1-stable.yml'
              )
              ;;
            macos)
              patterns=(
                --pattern 'yoda-*.dmg'
                --pattern 'yoda-*.dmg.blockmap'
                --pattern '*.delta'
                --pattern 'appcast-*.xml'
                --pattern 'v1-stable-mac*.yml'
              )
              ;;
          esac
          gh release download "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" \
            --dir release --clobber "${patterns[@]}"

      - name: Upload to China mirror
        if: ${{ steps.cn-mirror.outputs.has_cn_mirror == 'true' }}
        uses: ./.github/actions/upload-cn-mirror
        with:
          endpoint: ${{ vars.YODA_CN_MIRROR_ENDPOINT }}
          access-key-id: ${{ secrets.YODA_CN_MIRROR_ACCESS_KEY_ID }}
          secret-access-key: ${{ secrets.YODA_CN_MIRROR_SECRET_ACCESS_KEY }}
          public-base-url: ${{ vars.YODA_CN_MIRROR_PUBLIC_BASE_URL }}
          region: ${{ vars.YODA_CN_MIRROR_REGION || 'auto' }}
          key-prefix: ${{ vars.YODA_CN_MIRROR_KEY_PREFIX }}
